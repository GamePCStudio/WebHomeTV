name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: write

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "storeFile=release.keystore" >> local.properties
            echo "keyAlias=$KEY_ALIAS" >> local.properties
            echo "storePassword=$KEY_PASSWORD" >> local.properties
            echo "Signing configured with release keystore"
          else
            echo "No signing secrets — APK signed with debug key (cannot update existing install)"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: List build variants
        run: ./gradlew :app:tasks --all 2>&1 | grep -E "assemble.*Release$" | head -20

      - name: Install host Python 3.10 (Chaquopy v17 buildPython)
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.10 python3.10-venv python3.10-distutils
          python3.10 --version
          python3.10 -m venv --help >/dev/null

      - name: Build mobile-universal
        run: ./gradlew :app:assembleMobileUniversal${{ inputs.build_type || 'Release' }}

      - name: Build mobile-arm64
        run: ./gradlew :app:assembleMobileArm64_v8a${{ inputs.build_type || 'Release' }}

      - name: Build mobile-armv7
        run: ./gradlew :app:assembleMobileArmeabi_v7a${{ inputs.build_type || 'Release' }}

      - name: Build leanback-universal
        run: ./gradlew :app:assembleLeanbackUniversal${{ inputs.build_type || 'Release' }}

      - name: Build leanback-arm64
        run: ./gradlew :app:assembleLeanbackArm64_v8a${{ inputs.build_type || 'Release' }}

      - name: Build leanback-armv7
        run: ./gradlew :app:assembleLeanbackArmeabi_v7a${{ inputs.build_type || 'Release' }}

      - name: Collect APKs
        id: collect
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -type f -exec cp -v {} dist/ \;
          ls -la dist/

      - name: Check APK sizes (CNB raw limit is 100 MiB)
        run: |
          LIMIT=$((100 * 1024 * 1024))
          for apk in dist/*.apk; do
            size=$(stat -c %s "$apk")
            miB=$((size / 1024 / 1024))
            if [ "$size" -gt "$LIMIT" ]; then
              echo "::warning::$(basename "$apk") is ${miB} MiB — exceeds CNB raw 100 MiB limit"
            else
              echo "OK $(basename "$apk") ${miB} MiB"
            fi
          done

      - name: Generate update JSON manifests
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION_CODE="$(grep -m1 'versionCode' app/build.gradle | awk '{print $2}')"
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          for apk in dist/*.apk; do
            base=$(basename "$apk" .apk)
            cat > "dist/${base}.json" << JSONEOF
          {
            "name": "${{ github.ref_name }}",
            "desc": "${{ github.ref_name }} — $SHORT_SHA",
            "code": $VERSION_CODE
          }
          JSONEOF
            echo "Generated dist/${base}.json code=$VERSION_CODE"
          done

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ github.ref_name }}"
          export VERSION="${VERSION#v}"
          python3 - <<'PY'
          import os
          import re
          import textwrap
          from pathlib import Path

          version = os.environ["VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"(^## {re.escape(version)}[^\n]*\n.*?)(?=^## |\Z)"
          match = re.search(pattern, changelog, re.M | re.S)
          notes = match.group(1).strip() if match else f"## v{version} — Release\n\nBuilt automatically by GitHub Actions."
          notes += textwrap.dedent("""

          ### 6 个 APK 产物

          - `leanback-universal.apk` — TV 端通用包，适合不确定架构的电视/盒子
          - `leanback-arm64_v8a.apk` — TV 端 arm64 (v8a)
          - `leanback-armeabi_v7a.apk` — TV 端 armv7
          - `mobile-universal.apk` — 手机端通用包，适合不确定架构的手机
          - `mobile-arm64_v8a.apk` — 手机端 arm64 (v8a)
          - `mobile-armeabi_v7a.apk` — 手机端 armv7

          ### 兼容性提示

          - 远程 JAR 必须带 `;sha256;` 否则不加载
          - Android 11+ 文件管理按系统能力请求所有文件访问或回退到存储权限
          - 自更新改为导出到 Downloads 通知用户手动安装
          - 旧设备（Android ≤ 10）行为不变
          """)
          Path("dist/release-notes.md").write_text(notes, encoding="utf-8")
          PY
        env:
          VERSION: ${{ github.ref_name }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file dist/release-notes.md \
            dist/*.apk dist/*.json

      - name: Check mirror availability
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          if [ -z "$CNB_TOKEN" ]; then
            echo "::warning title=CNB Mirror Sync Disabled::CNB_TOKEN secret is not configured. Update mirror (cnb.cool) will NOT receive new APKs. Go to Settings → Secrets → Actions to add it."
          else
            echo "CNB_TOKEN configured, mirror sync will run."
          fi

      - name: Sync to mirror
        if: startsWith(github.ref, 'refs/tags/v') && env.CNB_TOKEN != ''
        continue-on-error: true
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          rm -rf cnb-mirror
          if ! git clone --depth 1 "https://cnb:$CNB_TOKEN@cnb.cool/code_free/webtv.git" cnb-mirror 2>&1; then
            echo "- CNB APK mirror: clone failed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cd cnb-mirror
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Store APKs via LFS so the git history does not bloat (was ~10 GiB).
          git lfs install --local >/dev/null 2>&1 || true
          git lfs track "apk/*.apk" >/dev/null 2>&1 || true
          mkdir -p apk
          # Keep only this release's files; drop stale APKs from previous releases.
          rm -f apk/*.apk
          cp ../dist/*.apk apk/
          cp ../dist/*.json apk/
          git add .gitattributes apk/
          git diff --cached --quiet && { echo "- CNB APK mirror: no changes" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          git commit -m "${{ github.ref_name }}"
          if git push origin HEAD:main 2>&1; then
            echo "- CNB APK mirror: synced (LFS)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- CNB APK mirror: push failed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sync TV source
        if: startsWith(github.ref, 'refs/tags/v') && env.CNB_TOKEN != ''
        continue-on-error: true
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          rm -rf cnb-tv
          if ! git clone --depth 1 "https://cnb:$CNB_TOKEN@cnb.cool/code_free/TV" cnb-tv 2>&1; then
            echo "- CNB TV source: clone failed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cd cnb-tv
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path('api.json')
          text = path.read_text(encoding='utf-8')
          pattern = r'\n\s*\{\s*"key":\s*"版本信息",\s*"name":\s*"版本｜信息",\s*"type":\s*3,\s*"api":\s*"csp_Market",\s*"searchable":\s*0,\s*"changeable":\s*0,\s*"indexs":\s*0,\s*"ext":\s*"https://pizazz\.s3\.bitiful\.net/single\.json"\s*\},'
          text = re.sub(pattern, '', text, count=1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api.json
          git diff --cached --quiet && { echo "- CNB TV source: no changes" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          git commit -m "chore: sync TV source for ${{ github.ref_name }}"
          if git push origin HEAD:master 2>&1; then
            echo "- CNB TV source: synced" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- CNB TV source: push failed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APKs as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webtv-apks-${{ github.ref_name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
