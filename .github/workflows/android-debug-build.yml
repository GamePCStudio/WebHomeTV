name: Android Debug Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    name: Build debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: DIAG list available SDK (stable + channel 3)
        run: |
          echo "=== sdkmanager version ==="; sdkmanager --version
          echo "=== STABLE platforms (android-3x) ==="; sdkmanager --list 2>/dev/null | grep -iE 'platforms;android-3[0-9]' | head -40
          echo "=== STABLE build-tools (3x) ==="; sdkmanager --list 2>/dev/null | grep -iE 'build-tools;[0-9]' | head -40
          echo "=== CHANNEL3 platforms (android-3x) ==="; sdkmanager --list --channel=3 2>/dev/null | grep -iE 'platforms;android-3[0-9]' | head -40
          echo "=== CHANNEL3 build-tools (3x) ==="; sdkmanager --list --channel=3 2>/dev/null | grep -iE 'build-tools;[0-9]' | head -40

      - name: Build debug APKs (skipped during diag)
        run: echo "DIAG ONLY - build skipped"

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: webhtv-debug-apks
          path: dist/*.apk
          retention-days: 30
