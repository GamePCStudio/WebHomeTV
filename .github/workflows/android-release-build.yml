name: Android Release Build

on:
  push:
    branches: [WebHomeTV.ASS]
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  release-build:
    name: Build signed release APKs (arm64 + v7a)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --update > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          # AGP's compileSdk=37 looks for platforms/android-37; this SDK generation ships android-37.0
          ln -sfn "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37" || true

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS_BASE64="${RELEASE_KEYSTORE_BASE64:-$KEYSTORE_BASE64}"
          STORE_PASSWORD="${RELEASE_STORE_PASSWORD:-$KEY_PASSWORD}"
          ALIAS="${RELEASE_KEY_ALIAS:-$KEY_ALIAS}"
          KEY_PASS="${RELEASE_KEY_PASSWORD:-$STORE_PASSWORD}"
          if [ -z "$KS_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$ALIAS" ]; then
            echo "::error title=Release signing not configured::Configure RELEASE_KEYSTORE_BASE64, RELEASE_KEY_ALIAS and RELEASE_STORE_PASSWORD in repository secrets."
            exit 1
          fi
          mkdir -p app/signing
          printf '%s' "$KS_BASE64" | base64 --decode > app/signing/release.jks
          {
            echo "storeFile=$GITHUB_WORKSPACE/app/signing/release.jks"
            echo "keyAlias=$ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASS"
          } > local.properties
          echo "Release signing configured"

      - name: Build signed release APKs (arm64 + v7a + universal)
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :app:assembleMobileArm64_v8aRelease \
            :app:assembleMobileArmeabi_v7aRelease \
            :app:assembleLeanbackArm64_v8aRelease \
            :app:assembleLeanbackArmeabi_v7aRelease \
            :app:assembleMobileUniversalRelease \
            :app:assembleLeanbackUniversalRelease \
            --no-daemon --build-cache

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          if [ -d Release/apk ]; then cp Release/apk/*.apk dist/ 2>/dev/null || true; fi
          ls -lh dist/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: webhtv-release-apks
          path: dist/*.apk
          retention-days: 30
