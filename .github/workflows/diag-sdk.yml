name: Diag SDK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: List available platforms / build-tools
        run: |
          echo "=== sdkmanager version ==="
          sdkmanager --version
          echo "=== STABLE channel: platforms (android-3x) ==="
          sdkmanager --list 2>/dev/null | grep -iE 'platforms;android-3[0-9]' | head -40
          echo "=== STABLE channel: build-tools (3x) ==="
          sdkmanager --list 2>/dev/null | grep -iE 'build-tools;[0-9]' | head -40
          echo "=== CHANNEL 3 (canary/preview): platforms (android-3x) ==="
          sdkmanager --list --channel=3 2>/dev/null | grep -iE 'platforms;android-3[0-9]' | head -40
          echo "=== CHANNEL 3: build-tools (3x) ==="
          sdkmanager --list --channel=3 2>/dev/null | grep -iE 'build-tools;[0-9]' | head -40
