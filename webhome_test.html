<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebHome 集成测试页</title>
<style>
  body { font-family: sans-serif; padding: 16px; background: #111; color: #eee; }
  h1 { font-size: 18px; }
  button { display: block; width: 100%; margin: 8px 0; padding: 12px; font-size: 15px; border: none; border-radius: 8px; background: #2a6; color: #fff; }
  .info { background: #222; border-radius: 8px; padding: 12px; margin: 8px 0; font-size: 13px; word-break: break-all; }
  pre { white-space: pre-wrap; margin: 0; }
</style>
</head>
<body>
<h1>WebHome 集成测试页</h1>
<div class="info" id="viewport">视口信息加载中...</div>
<div class="info"><pre id="fmvars"></pre></div>
<button onclick="testOpenVod()">测试 app.openVod()</button>
<button onclick="testPlayVodInline()">测试 player.playVodInline()</button>
<button onclick="testRawFetch()">测试 raw 内容加载</button>
<script>
  function refreshViewport() {
    var vp = window.__fmViewport;
    document.getElementById('viewport').textContent = vp ? JSON.stringify(vp, null, 1) : 'window.__fmViewport 未定义';
    console.log('WEBHOME_TEST viewport=' + JSON.stringify(vp));
    var root = document.documentElement.style;
    var names = ['--fm-web-width','--fm-web-height','--fm-safe-top','--fm-safe-right','--fm-safe-bottom','--fm-safe-left','--fm-chrome-mode','--fm-system-bars-hidden'];
    var lines = names.map(function(n){ return n + ': ' + (root.getPropertyValue(n) || '(空)'); });
    document.getElementById('fmvars').textContent = lines.join('\n');
    console.log('WEBHOME_TEST css=' + lines.join(' | '));
  }
  window.addEventListener('fmviewport', refreshViewport);
  setInterval(refreshViewport, 1000);

  function testOpenVod() {
    try { window.fongmi.app.openVod(); } catch (e) { alert('openVod 失败: ' + e.message); }
  }
  function testPlayVodInline() {
    try {
      window.fongmi.player.playVodInline({
        siteKey: 'webhome_inline',
        vodName: '内嵌测试',
        title: '内嵌测试',
        pic: '',
        mark: '第一集',
        episodes: [{ name: '第一集', mediaUrl: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8' }]
      });
    } catch (e) { alert('playVodInline 失败: ' + e.message); }
  }
  function testRawFetch() {
    fetch('https://raw.githubusercontent.com/Kimentanm/aptv/master/README.md')
      .then(function(r){ return r.text(); })
      .then(function(t){ alert('raw 拉取成功，长度 ' + t.length); })
      .catch(function(e){ alert('raw 拉取失败: ' + e.message); });
  }
  refreshViewport();

  // 支持 URL 参数自动触发：?test=openVod / ?test=playVodInline / ?test=raw
  (function(){
    var test = new URLSearchParams(location.search).get('test');
    console.log('WEBHOME_TEST auto-init test=' + test + ' fongmi=' + (window.fongmi ? 'yes' : 'no') + ' player=' + (window.fongmi && window.fongmi.player ? 'yes' : 'no'));
    if (!test) return;
    setTimeout(function(){
      console.log('WEBHOME_TEST auto-trigger test=' + test + ' fongmi=' + (window.fongmi ? 'yes' : 'no') + ' player=' + (window.fongmi && window.fongmi.player ? 'yes' : 'no') + ' playVodInline=' + (window.fongmi && window.fongmi.player && window.fongmi.player.playVodInline ? 'yes' : 'no'));
      if (test === 'openVod') testOpenVod();
      else if (test === 'playVodInline') testPlayVodInline();
      else if (test === 'raw') testRawFetch();
    }, 1500);
  })();
</script>
</body>
</html>
